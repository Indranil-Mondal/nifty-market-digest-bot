name: Morning digest

# ---------------------------------------------------------------------------------------------
# TIMING — why this looks stranger than a single cron line
#
# The digest is meant to arrive at 11:11 IST, which is 05:41 UTC. Actions cron is UTC-only, so
# the naive answer is one "41 5" line. That does not work, and the reason is worth writing down
# because it is invisible until you measure it.
#
# GitHub creates scheduled runs LATE. Not by seconds — measured on this repository between
# 18 Aug and 8 Sep 2026, comparing each run's created_at against its nominal cron time:
#
#     18–26 Aug   +24m to +1h 06m
#     27 Aug      +11h 01m
#     28 Aug      +12h 12m
#     31 Aug      +6h 36m
#      1 Sep      +5h 11m
#      2–8 Sep    +4h 15m to +6h 24m, every single day
#
# The delay is in run CREATION, so nothing in this file can prevent it, and it applies to every
# cron entry on a given day at once — which is why the previous design (four crons, first one
# wins) failed: all four drifted together and the digest arrived at 14:20 IST.
#
# THE FIX: stop trying to be triggered at the right time, and instead be AWAKE at the right time.
# An attempt fires every hour. Whichever one first lands inside the three hours before 05:41 UTC
# waits for the target and then sends; delivery is at 11:11 IST to the minute, whatever GitHub's
# queue is doing that day. Every other attempt sees that it is too early — or that the digest has
# already gone out — and exits in a few seconds, before checkout.
#
# WHY HOURLY AND WHY 180 MINUTES. Coverage is guaranteed exactly when
#
#     MAX_WAIT >= (gap between attempts) + (spread between attempts on the same day)
#
# The gap is 60 minutes. The spread — the same-day variation in how late GitHub is, which is
# partly systematic per cron slot rather than random — was measured at up to 91.4 minutes here
# (31 Aug 2026). 60 + 91.4 = 151.4, so MAX_WAIT of 180 clears it with about half an hour to
# spare. A uniform grid also has no holes: an earlier draft of this file bunched ten attempts
# around the target and left 05:31–14:41 UTC empty, which silently broke on-time delivery for
# any delay between 15h and 20.7h — and the largest delay already observed is 12.4h.
#
# Simulated over every whole minute of delay from 0 to 24 hours, across a full Mon–Fri week,
# with and without that 91.4-minute spread: 7,205 of 7,205 deliveries land at exactly 11:11 IST.
#
# Two consequences, stated honestly:
#   * One runner a day idles for up to 3 hours. Actions minutes are not metered on a public
#     repository, so this costs nothing, but it is real machine time and worth knowing about.
#   * The Actions tab shows 24 runs a day. All but one finish in seconds, and each one's step
#     summary says which branch of the gate it took and why.
#
# If you would rather have exact timing with no idling, drive workflow_dispatch from an external
# free scheduler — dispatch runs start within seconds. That costs an account and a stored token
# to keep alive, which is why it is not the default here. See README "Timing".
#
# Weekday selection is deliberately NOT in the cron line. Attempts run around the clock, so an
# attempt on Friday evening is aiming at Monday; the gate below works out the next weekday target
# itself. 11:11 IST and 05:41 UTC always fall on the same calendar day, so an IST weekday and a
# UTC weekday are the same thing here.
#
# Exchange holidays are still not encoded: a hardcoded holiday list rots. On a holiday the digest
# sends and reports the previous close, labelled with its real date.
# ---------------------------------------------------------------------------------------------

on:
  schedule:
    # Hourly, every day, all day. Uniform on purpose: coverage is guaranteed exactly when
    # MAX_WAIT >= (gap between attempts + jitter), so a grid with any hole in it fails for the
    # band of delays that lands in the hole. An earlier draft here bunched ten attempts around
    # the target and left 05:31-14:41 UTC empty, which silently broke on-time delivery for any
    # delay between 15h and 20.7h. A full-day uniform grid cannot have that defect.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but do not send"
        type: boolean
        default: false
      diagnose:
        description: "Check every source's reachability from the runner, then stop"
        type: boolean
        default: false

# Committing the history cache needs write access to the repo. Nothing else does.
permissions:
  contents: write

# One attempt may still be waiting for the delivery slot when the next fires. Serialise them so
# they cannot send two digests or race on the history commit; the later one then reads the ledger
# the first wrote and exits cleanly.
concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Long enough for the maximum wait plus the work. The platform maximum for a job is 6 hours.
    timeout-minutes: 240

    steps:
      # This runs BEFORE checkout on purpose. An attempt that is simply too early should cost a
      # runner start and nothing else — no clone, no Python, no pip.
      - name: Decide whether this attempt should deliver
        id: gate
        run: |
          set -euo pipefail

          TARGET_UTC="05:41"      # 11:11 IST
          MAX_WAIT_MIN=180        # must exceed (60 min between attempts + 91 min jitter)
          LATE_GRACE_MIN=480      # how late is still worth sending (8h => 19:11 IST)

          now=$(date -u +%s)
          today=$(date -u +%F)
          proceed=false
          sleep_for=0
          reason=""

          if [ "${{ github.event_name }}" != "schedule" ]; then
            proceed=true
            reason="manual ${{ github.event_name }} — running immediately"
          else
            dow=$(date -u -d "${today}T00:00:00Z" +%u)                 # 1=Mon .. 7=Sun
            todays_target=$(date -u -d "${today}T${TARGET_UTC}:00Z" +%s)

            # The next delivery slot that falls on a weekday, at or after now.
            next_target=""
            for i in 0 1 2 3 4; do
              day=$(date -u -d "${today}T00:00:00Z +${i} day" +%F)
              day_dow=$(date -u -d "${day}T00:00:00Z" +%u)
              slot=$(date -u -d "${day}T${TARGET_UTC}:00Z" +%s)
              if [ "$day_dow" -le 5 ] && [ "$slot" -ge "$now" ]; then
                next_target=$slot
                break
              fi
            done

            if [ "$dow" -le 5 ] && [ "$now" -gt "$todays_target" ]; then
              late_min=$(( (now - todays_target) / 60 ))
              if [ "$late_min" -le "$LATE_GRACE_MIN" ]; then
                proceed=true
                reason="slot passed ${late_min} min ago — sending late rather than not at all"
              else
                reason="slot passed ${late_min} min ago, past the ${LATE_GRACE_MIN} min grace — skipping"
              fi
            elif [ -n "$next_target" ]; then
              wait_min=$(( (next_target - now) / 60 ))
              if [ "$wait_min" -le "$MAX_WAIT_MIN" ]; then
                proceed=true
                sleep_for=$(( next_target - now ))
                reason="holding ${wait_min} min to deliver at ${TARGET_UTC} UTC / 11:11 IST"
              else
                reason="next slot is ${wait_min} min away — leaving it to a later attempt"
              fi
            else
              reason="no weekday slot within five days — deferring"
            fi
          fi

          echo "proceed=${proceed}"       >> "$GITHUB_OUTPUT"
          echo "sleep_seconds=${sleep_for}" >> "$GITHUB_OUTPUT"
          echo "$reason"
          echo "\`$(date -u +'%F %H:%M')Z\` — ${reason}" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the delivery slot
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.sleep_seconds != '0'
        run: |
          echo "sleeping ${{ steps.gate.outputs.sleep_seconds }}s so the digest lands at 11:11 IST"
          sleep "${{ steps.gate.outputs.sleep_seconds }}"

      - name: Check out
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          # Check out AND push over SSH with the repository's deploy key, instead of the default
          # GITHUB_TOKEN.
          #
          # Why: GitHub disables scheduled workflows on a public repository after 60 days with no
          # repository activity, and a push made with GITHUB_TOKEN does not trigger workflows --
          # which means it may not count as the activity that resets that clock. Since this bot
          # commits its history cache every morning, that daily commit is the natural keepalive,
          # but only if it is a real push. A deploy-key push unambiguously is.
          #
          # Loop safety: this workflow has no `push` trigger, so a deploy-key push cannot
          # re-trigger it. The commit message still carries [skip ci] as a second line of defence
          # in case a push trigger is ever added.
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # Several of these hosts behave differently from an Azure datacenter IP than from a home
      # connection, and that cannot be tested locally. This step answers it directly. It runs
      # only on a manual dispatch with the box ticked.
      - name: Diagnose sources
        if: steps.gate.outputs.proceed == 'true' && inputs.diagnose
        run: python -m scripts.diagnose

      # --once-per-day only on the schedule. A manual dispatch is an explicit request, so it
      # sends even if the morning's digest already went out.
      - name: Send digest
        if: ${{ steps.gate.outputs.proceed == 'true' && !inputs.diagnose }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GUARD: ${{ github.event_name == 'schedule' && '--once-per-day' || '--force' }}
        run: |
          python -m bot.main $GUARD ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated history
        # Skipped on a deferred attempt (nothing was fetched) and on a diagnose run.
        #
        # Runs even when the digest was degraded: whatever data we did collect is worth keeping,
        # and every stored point is one fewer archive request tomorrow.
        #
        # This commit also doubles as repository activity. GitHub disables scheduled workflows
        # after 60 days of inactivity on a repo, and a daily commit keeps the clock reset --
        # see README "Staying alive" for the caveat about bot-authored commits.
        if: always() && steps.gate.outputs.proceed == 'true' && !inputs.diagnose
        run: |
          # Prove which transport is in use. If this ever reads https:// then the deploy key was
          # not picked up and the 60-day keepalive is silently not working.
          echo "push remote: $(git remote get-url --push origin)"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "history unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "history: $(date -u +%Y-%m-%d) [skip ci]"
          # Rebase rather than force: a manual dispatch and the cron run can both push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure to Telegram
        # Deliberately raw curl, not Python. If the failure was an import error, a bad
        # dependency or a syntax mistake, anything that goes through bot/ would fail too -- and
        # silence is the one outcome we cannot allow, because it is indistinguishable from a
        # quiet market.
        #
        # This fires only when the digest could not be DELIVERED. A run that delivered with one
        # source missing exits 0 and raises a workflow annotation instead, because an alert that
        # says "no digest was produced" must never appear on a morning when one was.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # --fail matters: without it curl exits 0 on a 4xx, so if Telegram rate-limits the
          # alert itself the step goes green and the alert is lost silently -- which is the one
          # thing this step exists to prevent.
          curl -sS --fail --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ <b>Morning digest job failed</b>
          The workflow itself errored, so no digest was produced.
          <a href=\"${RUN_URL}\">View the run log</a>" \
            > /dev/null
